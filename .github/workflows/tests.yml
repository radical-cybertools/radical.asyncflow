name: tests

on:
  push:
    branches: [main, test-me-*]
  pull_request:
  workflow_dispatch:

jobs:
  unit:
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.9'
          toxenv: py39
        - os: ubuntu-latest
          python: '3.10'
          toxenv: py310
        - os: ubuntu-latest
          python: '3.11'
          toxenv: py311
        - os: ubuntu-latest
          python: '3.12'
          toxenv: py312
        - os: ubuntu-latest
          python: '3.13'
          toxenv: py313
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Get pip cache dir
        id: pip-cache-dir
        run: echo "PIP_CACHE_DIR=$(pip cache dir)" >> "$GITHUB_ENV"
      - name: Use pip cache
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: tests-unit-${{ matrix.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tests-unit-${{ matrix.os }}-pip-${{ matrix.python }}-
      - name: Install Packages
        run: python -m pip install --upgrade pip tox
      - name: Run Unit Tests
        run: tox -e ${{ matrix.toxenv }} -- -vv

  integration:
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
        - os: ubuntu-latest
          python: '3.9'
          toxenv: py39-all
        - os: ubuntu-latest
          python: '3.10'
          toxenv: py310-all
        - os: ubuntu-latest
          python: '3.11'
          toxenv: py311-all
        - os: ubuntu-latest
          python: '3.12'
          toxenv: py312-all
        - os: ubuntu-latest
          python: '3.13'
          toxenv: py313-all
    runs-on: ${{ matrix.os }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Get pip cache dir
        id: pip-cache-dir
        run: echo "PIP_CACHE_DIR=$(pip cache dir)" >> "$GITHUB_ENV"
      - name: Use pip cache
        id: pip-cache
        uses: actions/cache@v4
        with:
          path: ${{ env.PIP_CACHE_DIR }}
          key: tests-integration-${{ matrix.os }}-pip-${{ matrix.python }}-${{ hashFiles('pyproject.toml') }}
          restore-keys: |
            tests-integration-${{ matrix.os }}-pip-${{ matrix.python }}-
      - name: Install Packages
        run: python -m pip install --upgrade pip tox
      - name: Run Integration Tests
        run: tox -e ${{ matrix.toxenv }} -- -vv

  pre-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Run pre-commit
        uses: pre-commit/action@v3.0.1

  unit-eager:
    name: unit (3.12, eager task factory)
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Packages
        run: python -m pip install --upgrade pip tox
      - name: Run Unit Tests with asyncio.eager_task_factory
        run: tox -e py312 -- -vv --eager-tasks

  diff-cover:
    name: coverage of the lines a PR adds to src/
    if: github.event_name == 'pull_request'
    timeout-minutes: 15
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install Packages
        # RHAPSODY telemetry, so that the telemetry tests run and cover their lines
        run: >-
          python -m pip install --upgrade pip -e '.[dev]' diff-cover
          'rhapsody-py[telemetry]'
      - name: Run Tests with Coverage
        env:
          # Only the explicit examples of the property tests: random ones would
          # cover a line in some runs only.
          HYPOTHESIS_PROFILE: explicit
        run: python -m pytest tests/unit tests/integration --cov=radical.asyncflow --cov-report=xml
      - name: Check Coverage of the Changed Lines
        run: >-
          diff-cover coverage.xml --compare-branch="origin/$GITHUB_BASE_REF"
          --include 'src/**' --fail-under=100 --format markdown:diff-cover.md
      - name: Report
        if: always()
        run: if [ -f diff-cover.md ]; then cat diff-cover.md >> "$GITHUB_STEP_SUMMARY"; fi

  benchmark:
    name: benchmark against the base
    if: github.event_name == 'pull_request'
    # Informational for now: a slower head does not fail the build.
    continue-on-error: true
    timeout-minutes: 30
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Install the Base and the Head
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base=$(git merge-base HEAD "$BASE_SHA")
          echo "BASE=$base" >> "$GITHUB_ENV"
          git worktree add "$RUNNER_TEMP/base" "$base"
          for side in base head; do python -m venv "$RUNNER_TEMP/venv-$side"; done
          "$RUNNER_TEMP/venv-base/bin/pip" install -q "$RUNNER_TEMP/base"
          "$RUNNER_TEMP/venv-head/bin/pip" install -q .
      - name: Compare, Interleaved
        env:
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        # A text table here, a Markdown one in the run's summary
        run: |
          python benchmarks/engine_overhead.py compare \
            --base "$RUNNER_TEMP/venv-base/bin/python" \
            --head "$RUNNER_TEMP/venv-head/bin/python" \
            --base-label "base ${BASE::7}" --head-label "head ${HEAD_SHA::7}" \
            --markdown "$GITHUB_STEP_SUMMARY"
          echo "Informational: a slower head does not fail the build." \
            | tee -a "$GITHUB_STEP_SUMMARY"
          echo "Rendered: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
